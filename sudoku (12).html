<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🥭 Fruitline Sudoku</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --bg:#fff7ed; --surface:#fffdf8; --ink:#431400; --ink-muted:#a05a2c;
  --ink-faint:#e0b98a; --accent:#f97316; --clue-bg:#f97316;
  --cell-border:#fcd9a8; --box-border:#c2440a; --input-fg:#c2440a;
  --error-bg:#ffe4cc; --highlight:#fff3d6; --cell-size:54px;
  --sidebar-w:200px;
}

html,body{height:100%;overflow:hidden;}

body{
  background:var(--bg); font-family:'DM Mono',monospace; color:var(--ink);
  display:flex; transition:background 0.35s, color 0.35s;
}

/* ═══════════════════════ SIDEBAR ═══════════════════════ */
.sidebar{
  width:var(--sidebar-w); min-height:100vh; flex-shrink:0;
  background:var(--surface); border-right:2px solid var(--box-border);
  display:flex; flex-direction:column; padding:0;
  overflow-y:auto; transition:background 0.35s, border-color 0.35s;
  box-shadow:2px 0 12px rgba(0,0,0,0.06);
}

.sidebar-logo{
  padding:1.4rem 1rem 1rem;
  border-bottom:1px solid var(--cell-border);
  text-align:center;
}
.sidebar-logo .logo-fruit{ font-size:2rem; display:block; animation:sway 3s ease-in-out infinite; }
.sidebar-logo .logo-text{
  font-family:'Fraunces',serif; font-weight:300; font-size:1rem;
  letter-spacing:-0.01em; line-height:1.2; margin-top:0.3rem;
  color:var(--ink);
}
.sidebar-logo .logo-text em{ font-style:italic; color:var(--accent); }
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}

.sidebar-section-label{
  font-size:0.58rem; letter-spacing:0.12em; text-transform:uppercase;
  color:var(--ink-faint); padding:0.9rem 1rem 0.4rem; font-weight:600;
}

/* Fruit items */
.fruit-item{
  display:flex; align-items:center; gap:10px;
  padding:9px 12px 9px 14px; cursor:pointer;
  border-left:3px solid transparent;
  transition:all 0.15s; position:relative;
  user-select:none;
}
.fruit-item:hover{ background:rgba(0,0,0,0.04); }
.fruit-item.active{
  border-left-color:var(--accent);
  background:rgba(0,0,0,0.05);
}
.fruit-item .fi-emoji{ font-size:1.3rem; flex-shrink:0; }
.fruit-item .fi-info{ display:flex; flex-direction:column; gap:1px; min-width:0; }
.fruit-item .fi-name{ font-size:0.72rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fruit-item .fi-diff{ font-size:0.58rem; letter-spacing:0.04em; text-transform:uppercase; opacity:0.7; }
.fruit-item .fi-badge{
  margin-left:auto; font-size:0.48rem; font-weight:700; letter-spacing:0.03em;
  padding:2px 5px; border-radius:6px; white-space:nowrap; flex-shrink:0;
}
.fruit-item.rare .fi-badge{ background:#fbbf24; color:#5a3e00; display:block; }
.fruit-item.epic .fi-badge{ background:#a855f7; color:#fff; display:block; }
.fruit-item.legendary .fi-badge{ background:linear-gradient(90deg,#f97316,#ec4899); color:#fff; display:block; }
.fruit-item:not(.rare):not(.epic):not(.legendary) .fi-badge{ display:none; }

/* Mode items */
.mode-item{
  display:flex; align-items:center; gap:10px;
  padding:8px 12px 8px 14px; cursor:pointer;
  border-left:3px solid transparent;
  transition:all 0.15s; user-select:none;
}
.mode-item:hover{ background:rgba(0,0,0,0.04); }
.mode-item.active{ border-left-color:var(--accent); background:rgba(0,0,0,0.05); }
.mode-item .mi-icon{ font-size:1rem; flex-shrink:0; width:20px; text-align:center; }
.mode-item .mi-info{ display:flex; flex-direction:column; gap:1px; }
.mode-item .mi-name{ font-size:0.72rem; font-weight:500; }
.mode-item .mi-desc{ font-size:0.57rem; opacity:0.6; letter-spacing:0.02em; }

.sidebar-divider{ height:1px; background:var(--cell-border); margin:0.5rem 0; }

/* ═══════════════════════ MAIN ═══════════════════════ */
.main{
  flex:1; display:flex; flex-direction:column; align-items:center;
  padding:2rem 2rem 3rem; overflow-y:auto; min-height:100vh;
}

/* HEADER */
.game-header{ text-align:center; margin-bottom:1.6rem; }
.game-header h1{
  font-family:'Fraunces',serif; font-weight:300; font-size:2.4rem;
  letter-spacing:-0.02em; line-height:1;
}
.game-header h1 em{ font-style:italic; color:var(--accent); }
.game-header .subtitle{
  font-size:0.7rem; color:var(--ink-muted); margin-top:0.35rem;
  letter-spacing:0.07em; text-transform:uppercase;
}

/* mode badge under title */
.mode-badge{
  display:inline-flex; align-items:center; gap:6px;
  margin-top:0.6rem; padding:4px 14px; border-radius:20px;
  border:1.5px solid var(--box-border); font-size:0.68rem;
  letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-muted);
}
.mode-badge span{ font-size:0.9rem; }

/* GRID WRAPPER */
.grid-wrapper{
  background:var(--surface); border:2px solid var(--box-border);
  border-radius:8px; padding:1.5rem;
  box-shadow:4px 4px 0 var(--box-border);
  transition:border-color 0.35s, box-shadow 0.35s, background 0.35s;
}

.col-labels{ display:grid; grid-template-columns:20px repeat(9,var(--cell-size)); margin-bottom:3px; }
.col-label{ display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--ink-muted); font-weight:500; }
.rows-area{ display:flex; gap:3px; }
.row-labels-col{ display:flex; flex-direction:column; }
.row-label{ height:var(--cell-size); width:20px; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--ink-muted); font-weight:500; }

.sudoku-grid{
  display:grid;
  grid-template-columns:repeat(9,var(--cell-size));
  grid-template-rows:repeat(9,var(--cell-size));
  border:2.5px solid var(--box-border);
}
.cell{
  width:var(--cell-size); height:var(--cell-size);
  border:0.5px solid var(--cell-border);
  position:relative; background:var(--surface); transition:background 0.1s;
}
.cell:focus-within{ background:var(--highlight); }
.cell.error{ background:var(--error-bg); }
.cell.given{ background:rgba(0,0,0,0.03); }
.cell.thick-right{ border-right:2.5px solid var(--box-border); }
.cell.thick-bottom{ border-bottom:2.5px solid var(--box-border); }

/* Killer cage borders */
.cell.cage-top{ border-top:2px dashed var(--accent)!important; }
.cell.cage-left{ border-left:2px dashed var(--accent)!important; }
.cell.cage-right-inner{ border-right:2px dashed var(--accent)!important; }
.cell.cage-bottom-inner{ border-bottom:2px dashed var(--accent)!important; }
.cage-sum{
  position:absolute; top:2px; left:3px; font-size:9px; font-weight:600;
  color:var(--accent); line-height:1; z-index:15; pointer-events:none;
}

.cell input{
  width:100%; height:100%; border:none; background:transparent;
  text-align:center; font-family:'DM Mono',monospace;
  font-size:1.2rem; font-weight:500; color:var(--input-fg);
  cursor:pointer; outline:none; caret-color:var(--accent); padding:0;
}
.cell.given input{ color:var(--ink); font-weight:600; pointer-events:none; }
.cell input::-webkit-inner-spin-button,.cell input::-webkit-outer-spin-button{-webkit-appearance:none;}

.border-clue{
  position:absolute; font-size:10px; font-weight:500;
  font-family:'DM Mono',monospace; background:var(--clue-bg);
  color:#fff; border-radius:10px; padding:2px 5px;
  z-index:20; pointer-events:none; line-height:1.3;
}
.clue-right{ right:-12px; top:50%; transform:translateY(-50%); }
.clue-bottom{ bottom:-12px; left:50%; transform:translateX(-50%); }

/* CONTROLS */
.controls{ margin-top:1.2rem; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
button{
  font-family:'DM Mono',monospace; font-size:0.7rem; letter-spacing:0.04em;
  text-transform:uppercase; padding:7px 15px; border-radius:4px;
  cursor:pointer; transition:all 0.12s; border:1.5px solid var(--box-border);
  background:transparent; color:var(--ink);
}
button:hover{ background:var(--ink); color:var(--surface); }
button.primary{ background:var(--ink); color:var(--surface); }
button.primary:hover{ background:var(--accent); border-color:var(--accent); }

.note{ margin-top:0.9rem; font-size:0.65rem; color:var(--ink-faint); letter-spacing:0.04em; text-align:center; }

/* ═══════════════════════ MOBILE ═══════════════════════ */
@media (max-width: 700px) {
  :root{ --cell-size: calc((100vw - 48px) / 9); --sidebar-w:0px; }

  html,body{ overflow:auto; height:auto; }

  body{ flex-direction:column; }

  /* Hide desktop sidebar */
  .sidebar{ display:none !important; }

  /* Main takes full width */
  .main{ padding:0.8rem 0.6rem 7rem; width:100%; align-items:center; min-height:auto; overflow:visible; }

  /* Compact header */
  .game-header{ margin-bottom:0.8rem; }
  .game-header h1{ font-size:1.5rem; }
  .game-header .subtitle{ font-size:0.6rem; }
  .mode-badge{ font-size:0.6rem; padding:3px 10px; margin-top:0.4rem; }
  #headerFruit{ font-size:1.2rem !important; }

  /* Grid wrapper tighter */
  .grid-wrapper{ padding:0.6rem; box-shadow:3px 3px 0 var(--box-border); border-radius:6px; }
  .col-labels{ grid-template-columns: 14px repeat(9, var(--cell-size)); margin-bottom:2px; }
  .col-label{ font-size:8px; }
  .row-label{ width:14px; font-size:8px; }

  /* Border clues smaller on mobile */
  .border-clue{ font-size:8px; padding:1px 3px; border-radius:7px; }
  .clue-right{ right:-9px; }
  .clue-bottom{ bottom:-9px; }
  .cage-sum{ font-size:7px; }

  /* Cell font */
  .cell input{ font-size:1rem; }

  /* Controls row */
  .controls{ margin-top:0.8rem; gap:5px; }
  button{ font-size:0.62rem; padding:6px 10px; }

  .note{ display:none; }

  /* ── MOBILE BOTTOM NAV ── */
  .mobile-nav{
    display:flex; position:fixed; bottom:0; left:0; right:0;
    background:var(--surface); border-top:2px solid var(--box-border);
    z-index:1000; height:56px;
    box-shadow:0 -2px 12px rgba(0,0,0,0.1);
  }
  .mobile-nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:2px; cursor:pointer;
    border:none; background:transparent; color:var(--ink-muted);
    font-family:'DM Mono',monospace; font-size:0.52rem;
    letter-spacing:0.04em; text-transform:uppercase; padding:0;
    transition:color 0.15s, background 0.15s;
    border-right:1px solid var(--cell-border);
  }
  .mobile-nav-btn:last-child{ border-right:none; }
  .mobile-nav-btn .nav-icon{ font-size:1.3rem; line-height:1; }
  .mobile-nav-btn.active{ color:var(--accent); background:rgba(0,0,0,0.03); }

  /* ── MOBILE SHEETS (slide up) ── */
  .mobile-sheet{
    display:none; position:fixed; bottom:56px; left:0; right:0;
    background:var(--surface); border-top:2px solid var(--box-border);
    z-index:999; padding:0.8rem 0.8rem 0.5rem;
    box-shadow:0 -4px 20px rgba(0,0,0,0.12);
    max-height:55vh; overflow-y:auto;
    border-radius:16px 16px 0 0;
  }
  .mobile-sheet.open{ display:block; }
  .sheet-title{
    font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--ink-faint); margin-bottom:0.7rem; text-align:center;
  }
  /* Fruit grid in sheet */
  .sheet-fruits{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
  }
  .sheet-fruit-btn{
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:10px 4px; border-radius:10px; border:2px solid transparent;
    cursor:pointer; background:rgba(0,0,0,0.03); transition:all 0.15s;
    font-family:'DM Mono',monospace;
  }
  .sheet-fruit-btn.active{ border-color:var(--accent); background:rgba(0,0,0,0.06); }
  .sheet-fruit-btn .sf-emoji{ font-size:1.6rem; }
  .sheet-fruit-btn .sf-name{ font-size:0.58rem; font-weight:500; color:var(--ink); }
  .sheet-fruit-btn .sf-badge{ font-size:0.48rem; font-weight:700; padding:1px 5px; border-radius:6px; }
  /* Mode list in sheet */
  .sheet-modes{ display:flex; flex-direction:column; gap:6px; }
  .sheet-mode-btn{
    display:flex; align-items:center; gap:10px; padding:10px 12px;
    border-radius:10px; border:2px solid transparent;
    cursor:pointer; background:rgba(0,0,0,0.03); transition:all 0.15s;
    font-family:'DM Mono',monospace;
  }
  .sheet-mode-btn.active{ border-color:var(--accent); background:rgba(0,0,0,0.06); }
  .sheet-mode-btn .sm-icon{ font-size:1.2rem; }
  .sheet-mode-btn .sm-name{ font-size:0.72rem; font-weight:500; color:var(--ink); }
  .sheet-mode-btn .sm-desc{ font-size:0.57rem; color:var(--ink-muted); }

  /* ── NUMBER PAD ── */
  .numpad-sheet{
    display:none; position:fixed; bottom:56px; left:0; right:0;
    background:var(--surface); border-top:2px solid var(--box-border);
    z-index:999; padding:0.6rem;
    box-shadow:0 -4px 20px rgba(0,0,0,0.12);
    border-radius:16px 16px 0 0;
  }
  .numpad-sheet.open{ display:block; }
  .numpad-grid{
    display:grid; grid-template-columns:repeat(5,1fr); gap:6px;
  }
  .numpad-btn{
    height:48px; border:1.5px solid var(--cell-border); border-radius:8px;
    background:var(--surface); color:var(--input-fg);
    font-family:'DM Mono',monospace; font-size:1.3rem; font-weight:600;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:all 0.1s; -webkit-tap-highlight-color:transparent;
  }
  .numpad-btn:active{ background:var(--accent); color:#fff; border-color:var(--accent); transform:scale(0.95); }
  .numpad-btn.del{ font-size:1rem; color:var(--ink-muted); }
  .numpad-btn.clear-btn{ font-size:0.65rem; letter-spacing:0.03em; text-transform:uppercase; color:var(--ink-muted); border-style:dashed; }

  /* Selected cell highlight for numpad */
  .cell.selected{ background:var(--highlight) !important; outline:2px solid var(--accent); outline-offset:-2px; }
}

/* Hide mobile UI on desktop */
@media (min-width:701px){
  .mobile-nav,.mobile-sheet,.numpad-sheet{ display:none !important; }
}
</style>
</head>
<body>

<!-- ═══ SIDEBAR ═══ -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <span class="logo-fruit" id="sidebarFruit">🥭</span>
    <div class="logo-text">Fruit<em>line</em><br>Sudoku</div>
  </div>

  <div class="sidebar-section-label">🍑 Fruit Theme</div>
  <div id="fruitList"></div>

  <div class="sidebar-divider"></div>
  <div class="sidebar-section-label">🎮 Game Mode</div>
  <div id="modeList"></div>
</aside>

<!-- ═══ MAIN ═══ -->
<main class="main">
  <div class="game-header">
    <div class="logo-fruit" id="headerFruit" style="font-size:1.6rem;margin-bottom:0.3rem;display:inline-block;animation:sway 3s ease-in-out infinite;">🥭</div>
    <h1 id="mainTitle">Juicy<em>line</em> Sudoku</h1>
    <div class="subtitle" id="mainSubtitle">Border numbers = difference between adjacent cells</div>
    <div class="mode-badge" id="modeBadge"><span>🧩</span> Borderline Mode</div>
  </div>

  <div class="grid-wrapper">
    <div class="col-labels">
      <div></div>
      <div class="col-label">A</div><div class="col-label">B</div><div class="col-label">C</div>
      <div class="col-label">D</div><div class="col-label">E</div><div class="col-label">F</div>
      <div class="col-label">G</div><div class="col-label">H</div><div class="col-label">I</div>
    </div>
    <div class="rows-area">
      <div class="row-labels-col">
        <div class="row-label">1</div><div class="row-label">2</div><div class="row-label">3</div>
        <div class="row-label">4</div><div class="row-label">5</div><div class="row-label">6</div>
        <div class="row-label">7</div><div class="row-label">8</div><div class="row-label">9</div>
      </div>
      <div class="sudoku-grid" id="grid"></div>
    </div>
    <div class="controls">
      <button onclick="refreshBoard()">⟳ Refresh</button>
      <button onclick="clearAll()">Clear</button>
      <button onclick="checkDuplicates()">Check</button>
      <button class="primary" onclick="clearErrors()">✓ Clear Errors</button>
    </div>
  </div>
  <p class="note">Type 1–9 · Arrow keys to navigate · Delete to erase</p>
</main>

<!-- ═══ MOBILE BOTTOM NAV ═══ -->
<nav class="mobile-nav" id="mobileNav">
  <button class="mobile-nav-btn" id="navFruit" onclick="toggleSheet('fruitSheet')">
    <span class="nav-icon" id="navFruitIcon">🥭</span>
    <span>Fruit</span>
  </button>
  <button class="mobile-nav-btn" id="navMode" onclick="toggleSheet('modeSheet')">
    <span class="nav-icon">🎮</span>
    <span>Mode</span>
  </button>
  <button class="mobile-nav-btn" onclick="refreshBoard()">
    <span class="nav-icon">⟳</span>
    <span>Sync</span>
  </button>
  <button class="mobile-nav-btn" onclick="clearAll()">
    <span class="nav-icon">🗑️</span>
    <span>Clear</span>
  </button>
</nav>

<!-- Fruit sheet -->
<div class="mobile-sheet" id="fruitSheet">
  <div class="sheet-title">🍑 Choose your fruit</div>
  <div class="sheet-fruits" id="sheetFruits"></div>
</div>

<!-- Mode sheet -->
<div class="mobile-sheet" id="modeSheet">
  <div class="sheet-title">🎮 Game mode</div>
  <div class="sheet-modes" id="sheetModes"></div>
</div>

<!-- Number pad -->
<div class="numpad-sheet" id="numpadSheet">
  <div class="numpad-grid" id="numpadGrid"></div>
</div>

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = ''; cells = [];
  for (let r=0;r<9;r++) {
    cells[r]=[];
    for (let c=0;c<9;c++) {
      const cell = document.createElement('div');
      cell.className='cell';
      if([2,5].includes(c)) cell.classList.add('thick-right');
      if([2,5].includes(r)) cell.classList.add('thick-bottom');
      const inp = document.createElement('input');
      inp.type='text'; inp.maxLength=1; inp.inputMode='numeric';
      inp.dataset.row=r; inp.dataset.col=c;
      inp.setAttribute('aria-label',COLS_LABEL[c]+(r+1));
      inp.addEventListener('keydown',handleKey);
      inp.addEventListener('input',handleInput);
      cell.appendChild(inp);
      cell.id='cell-'+r+'-'+c;
      cells[r][c]=cell;
      grid.appendChild(cell);
    }
  }
}

function setupMode() {
  // clear all mode decorations
  for(let r=0;r<9;r++) for(let c=0;c<9;c++) {
    const cell=cells[r][c];
    cell.querySelectorAll('.border-clue,.cage-sum').forEach(e=>e.remove());
    cell.classList.remove('given','cage-top','cage-left','cage-right-inner','cage-bottom-inner');
    const inp=cell.querySelector('input');
    inp.value=''; inp.readOnly=false;
  }

  if(curMode.id==='borderline') {
    const clues = BORDERLINE[curFruit.id]||BORDERLINE.mango;
    clues.forEach(({col,row,dir,val})=>{
      const d=document.createElement('div');
      d.className='border-clue '+(dir==='r'?'clue-right':'clue-bottom');
      d.textContent=val; cells[row][col].appendChild(d);
    });
  }

  if(curMode.id==='classic'||curMode.id==='diagonal') {
    const src = curMode.id==='diagonal' ? DIAGONAL : CLASSIC;
    const givens = (src[curFruit.id]||src.mango);
    givens.forEach(([r,c,v])=>{
      cells[r][c].classList.add('given');
      cells[r][c].querySelector('input').value=v;
      cells[r][c].querySelector('input').readOnly=true;
    });
  }

  if(curMode.id==='killer') {
    const cages = KILLER[curFruit.id]||KILLER.mango;
    // Build a cell→cage map
    const cageMap={}; cages.forEach((cage,i)=>cage.cells.forEach(([r,c])=>cageMap[r+','+c]=i));
    cages.forEach((cage)=>{
      // Find top-left cell to put sum label
      const sorted=[...cage.cells].sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
      const [tr,tc]=sorted[0];
      const lbl=document.createElement('div');
      lbl.className='cage-sum'; lbl.textContent=cage.sum;
      cells[tr][tc].appendChild(lbl);
    });
  }
}

// ══════════════════════════════════════════════════════════════
//  THEME + TITLE
// ══════════════════════════════════════════════════════════════
function applyTheme(f) {
  const s=document.documentElement.style;
  s.setProperty('--bg',f.bg); s.setProperty('--surface',f.surface);
  s.setProperty('--ink',f.ink); s.setProperty('--ink-muted',f.inkMuted);
  s.setProperty('--accent',f.accent); s.setProperty('--clue-bg',f.clueBg);
  s.setProperty('--box-border',f.boxBorder); s.setProperty('--input-fg',f.inputFg);
  s.setProperty('--cell-border',f.cellBorder); s.setProperty('--error-bg',f.errorBg);
  s.setProperty('--highlight',f.highlight);
  document.getElementById('sidebarFruit').textContent=f.emoji;
  document.getElementById('headerFruit').textContent=f.emoji;
  // Active states
  document.querySelectorAll('.fruit-item').forEach(el=>el.classList.toggle('active',el.dataset.id===f.id));
}

function updateHeader() {
  const f=curFruit, m=curMode;
  document.getElementById('mainTitle').innerHTML = `${f.phrase}<em>line</em> Sudoku`;
  document.getElementById('mainSubtitle').textContent = f.tagline;
  document.getElementById('modeBadge').innerHTML = `<span>${m.badgeIcon}</span> ${m.name} Mode`;
  document.querySelectorAll('.mode-item').forEach(el=>el.classList.toggle('active',el.dataset.id===m.id));
  document.title = f.emoji+' '+f.phrase+'line Sudoku';
}

// ══════════════════════════════════════════════════════════════
//  SWITCH
// ══════════════════════════════════════════════════════════════
function switchFruit(id) {
  saveProgress();
  curFruit=FRUITS.find(f=>f.id===id);
  applyTheme(curFruit); updateHeader();
  buildGrid(); setupMode(); loadProgress(false);
}

function switchMode(id) {
  saveProgress();
  curMode=MODES.find(m=>m.id===id);
  updateHeader();
  buildGrid(); setupMode(); loadProgress(false);
}

// ══════════════════════════════════════════════════════════════
//  INPUT
// ══════════════════════════════════════════════════════════════
function handleInput(e) {
  const v=e.target.value.replace(/[^1-9]/g,'');
  e.target.value=v?v[v.length-1]:'';
  checkErrors(); saveProgress();
}

function handleKey(e) {
  const r=+e.target.dataset.row, c=+e.target.dataset.col;
  const m={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
  if(m[e.key]){e.preventDefault();const[dr,dc]=m[e.key];const nr=r+dr,nc=c+dc;if(nr>=0&&nr<9&&nc>=0&&nc<9)cells[nr][nc].querySelector('input').focus();}
  if(e.key==='Backspace'||e.key==='Delete'){if(!e.target.readOnly){e.target.value='';checkErrors();saveProgress();}}
}

// ══════════════════════════════════════════════════════════════
//  VALIDATION
// ══════════════════════════════════════════════════════════════
function checkErrors() {
  clearErrors();
  const get=(r,c)=>cells[r][c].querySelector('input').value;

  // Rows
  for(let r=0;r<9;r++){const s={};for(let c=0;c<9;c++){const v=get(r,c);if(!v)continue;if(s[v]!==undefined){cells[r][c].classList.add('error');cells[r][s[v]].classList.add('error');}else s[v]=c;}}
  // Cols
  for(let c=0;c<9;c++){const s={};for(let r=0;r<9;r++){const v=get(r,c);if(!v)continue;if(s[v]!==undefined){cells[r][c].classList.add('error');cells[s[v]][c].classList.add('error');}else s[v]=r;}}
  // Boxes
  for(let br=0;br<3;br++)for(let bc=0;bc<3;bc++){const s={};for(let dr=0;dr<3;dr++)for(let dc=0;dc<3;dc++){const r=br*3+dr,c=bc*3+dc,v=get(r,c);if(!v)continue;const k=r+','+c;if(s[v]){cells[r][c].classList.add('error');const[pr,pc]=s[v].split(',');cells[pr][pc].classList.add('error');}else s[v]=k;}}

  if(curMode.id==='borderline') {
    const clues=BORDERLINE[curFruit.id]||BORDERLINE.mango;
    clues.forEach(cl=>{
      let r1=cl.row,c1=cl.col,r2=cl.row,c2=cl.col;
      if(cl.dir==='r')c2++;else r2++;
      if(r2>8||c2>8)return;
      const a=get(r1,c1),b=get(r2,c2);
      if(a&&b&&Math.abs(parseInt(a)-parseInt(b))!==cl.val){cells[r1][c1].classList.add('error');cells[r2][c2].classList.add('error');}
    });
  }

  if(curMode.id==='diagonal') {
    // Main diagonal ↘
    {const s={};for(let i=0;i<9;i++){const v=get(i,i);if(!v)continue;if(s[v]!==undefined){cells[i][i].classList.add('error');cells[s[v]][s[v]].classList.add('error');}else s[v]=i;}}
    // Anti diagonal ↗
    {const s={};for(let i=0;i<9;i++){const v=get(i,8-i);if(!v)continue;if(s[v]!==undefined){cells[i][8-i].classList.add('error');cells[s[v]][8-s[v]].classList.add('error');}else s[v]=i;}}
  }

  if(curMode.id==='killer') {
    const cages=KILLER[curFruit.id]||KILLER.mango;
    cages.forEach(cage=>{
      const vals=cage.cells.map(([r,c])=>get(r,c)).filter(Boolean);
      // duplicate within cage
      const seen={};
      cage.cells.forEach(([r,c])=>{
        const v=get(r,c); if(!v)return;
        if(seen[v]!==undefined){cells[r][c].classList.add('error');const[pr,pc]=seen[v];cells[pr][pc].classList.add('error');}
        else seen[v]=[r,c];
      });
      // sum exceeded
      if(vals.length===cage.cells.length){
        const total=vals.reduce((a,b)=>a+parseInt(b),0);
        if(total!==cage.sum) cage.cells.forEach(([r,c])=>cells[r][c].classList.add('error'));
      }
    });
  }
}

function checkDuplicates(){checkErrors();}
function clearErrors(){for(let r=0;r<9;r++)for(let c=0;c<9;c++)cells[r][c].classList.remove('error');}

// ══════════════════════════════════════════════════════════════
//  SAVE / LOAD
// ══════════════════════════════════════════════════════════════
function saveKey(){return 'fruitsudoku_'+curFruit.id+'_'+curMode.id;}

function saveProgress(){
  const d=[];
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){
    const inp=cells[r][c].querySelector('input');
    d.push(inp.readOnly?'':inp.value||'');
  }
  localStorage.setItem(saveKey(),JSON.stringify(d));
}

function loadProgress(silent){
  const saved=localStorage.getItem(saveKey());
  if(!saved)return;
  const d=JSON.parse(saved); let filled=0;
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){
    const inp=cells[r][c].querySelector('input');
    if(inp.readOnly)continue;
    const v=d[r*9+c]||''; inp.value=v; if(v)filled++;
  }
  checkErrors();
  if(!silent&&filled>0)showToast('Progress restored '+curFruit.emoji);
}

function clearAll(){
  if(!confirm('Clear progress for '+curFruit.name+' '+curMode.name+'? '+curFruit.emoji))return;
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){
    const inp=cells[r][c].querySelector('input');
    if(!inp.readOnly){inp.value='';cells[r][c].classList.remove('error');}
  }
  localStorage.removeItem(saveKey());
  showToast('Board cleared '+curFruit.emoji);
}

function refreshBoard(){loadProgress(true);showToast('Refreshed '+curFruit.emoji);}

// ══════════════════════════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════════════════════════
function showToast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:1.8rem;left:50%;transform:translateX(-50%);background:var(--clue-bg);color:#fff;font-family:DM Mono,monospace;font-size:0.76rem;padding:9px 20px;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,0.15);opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:9999;letter-spacing:0.04em;';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity='0',2200);
}

// ══════════════════════════════════════════════════════════════
//  CROSS-TAB SYNC
// ══════════════════════════════════════════════════════════════
window.addEventListener('storage',e=>{
  if(e.key===saveKey()){loadProgress(true);showToast('Synced from other tab '+curFruit.emoji);}
});

// ══════════════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════════════
applyTheme(curFruit);
updateHeader();
buildGrid();
setupMode();
loadProgress(false);

// ══════════════════════════════════════════════════════════════
//  MOBILE SUPPORT
// ══════════════════════════════════════════════════════════════
let selectedCell = null;

function isMobile(){ return window.innerWidth <= 700; }

// Build mobile fruit sheet
function buildMobileSheets(){
  const sf = document.getElementById('sheetFruits');
  sf.innerHTML='';
  FRUITS.forEach(f=>{
    const btn=document.createElement('div');
    btn.className='sheet-fruit-btn'+(f.rarity?' '+f.rarity:'');
    btn.dataset.id=f.id;
    const badgeColors={rare:'background:#fbbf24;color:#5a3e00',epic:'background:#a855f7;color:#fff',legendary:'background:linear-gradient(90deg,#f97316,#ec4899);color:#fff'};
    const badgeStyle=badgeColors[f.rarity]||'display:none';
    btn.innerHTML=`<div class="sf-emoji">${f.emoji}</div><div class="sf-name">${f.name}</div><div class="sf-badge" style="${badgeStyle}">${f.rarityLabel||''}</div>`;
    btn.addEventListener('click',()=>{ switchFruit(f.id); closeAllSheets(); updateMobileNav(); });
    sf.appendChild(btn);
  });

  const sm = document.getElementById('sheetModes');
  sm.innerHTML='';
  MODES.forEach(m=>{
    const btn=document.createElement('div');
    btn.className='sheet-mode-btn';
    btn.dataset.id=m.id;
    btn.innerHTML=`<div class="sm-icon">${m.icon}</div><div><div class="sm-name">${m.name}</div><div class="sm-desc">${m.desc}</div></div>`;
    btn.addEventListener('click',()=>{ switchMode(m.id); closeAllSheets(); updateMobileNav(); });
    sm.appendChild(btn);
  });

  updateMobileSheetActive();
}

function updateMobileSheetActive(){
  document.querySelectorAll('.sheet-fruit-btn').forEach(b=>b.classList.toggle('active',b.dataset.id===curFruit.id));
  document.querySelectorAll('.sheet-mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.id===curMode.id));
}

function updateMobileNav(){
  document.getElementById('navFruitIcon').textContent=curFruit.emoji;
  updateMobileSheetActive();
}

// Build numpad
function buildNumpad(){
  const grid=document.getElementById('numpadGrid');
  grid.innerHTML='';
  [1,2,3,4,5,6,7,8,9].forEach(n=>{
    const btn=document.createElement('button');
    btn.className='numpad-btn'; btn.textContent=n;
    btn.addEventListener('click',()=>numpadPress(String(n)));
    grid.appendChild(btn);
  });
  // Delete
  const del=document.createElement('button');
  del.className='numpad-btn del'; del.textContent='⌫';
  del.addEventListener('click',()=>numpadPress('del'));
  grid.appendChild(del);
}

function numpadPress(val){
  if(!selectedCell) return;
  const inp=selectedCell.querySelector('input');
  if(inp.readOnly) return;
  if(val==='del'){ inp.value=''; }
  else { inp.value=val; }
  // Fire input event for validation + save
  inp.dispatchEvent(new Event('input',{bubbles:true}));
}

// Toggle sheet open/close
function toggleSheet(id){
  const sheet=document.getElementById(id);
  const isOpen=sheet.classList.contains('open');
  closeAllSheets();
  if(!isOpen) sheet.classList.add('open');
}

function closeAllSheets(){
  document.querySelectorAll('.mobile-sheet').forEach(s=>s.classList.remove('open'));
}

// Cell tap → select + show numpad on mobile
function setupMobileCellTap(){
  for(let r=0;r<9;r++) for(let c=0;c<9;c++){
    const cell=cells[r][c];
    const inp=cell.querySelector('input');
    // On mobile, intercept tap to select cell + open numpad
    cell.addEventListener('click',()=>{
      if(!isMobile()) return;
      if(inp.readOnly) return;
      closeAllSheets();
      // Deselect previous
      if(selectedCell) selectedCell.classList.remove('selected');
      selectedCell=cell;
      cell.classList.add('selected');
      // Open numpad
      document.getElementById('numpadSheet').classList.add('open');
    });
  }
}

// Close sheets when tapping outside
document.addEventListener('click', e=>{
  if(!isMobile()) return;
  const inSheet=e.target.closest('.mobile-sheet,.numpad-sheet,.mobile-nav-btn,.cell');
  if(!inSheet) { closeAllSheets(); if(selectedCell){selectedCell.classList.remove('selected');selectedCell=null;} }
});

// Wrap original switchFruit/switchMode to also update mobile UI
const _origSwitchFruit=switchFruit;
// We'll hook after init instead via patchAfterInit

function patchMobile(){
  buildMobileSheets();
  buildNumpad();
  updateMobileNav();
  setupMobileCellTap();
}

// Run mobile setup after grid is built
setTimeout(patchMobile, 0);

// Also re-patch cell taps after every switchFruit/switchMode
const _switchFruitOrig=window.switchFruit;
window.switchFruit=function(id){
  _switchFruitOrig(id);
  setTimeout(()=>{ setupMobileCellTap(); updateMobileNav(); buildMobileSheets(); },50);
};
const _switchModeOrig=window.switchMode;
window.switchMode=function(id){
  _switchModeOrig(id);
  setTimeout(()=>{ setupMobileCellTap(); updateMobileSheetActive(); },50);
};

</script>
