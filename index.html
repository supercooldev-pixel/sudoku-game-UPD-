<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🥭 Fruitline Sudoku</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Bebas+Neue&family=Righteous&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

:root{
  --bg:#fff7ed; --surface:#fffdf8; --ink:#431400; --ink-muted:#a05a2c;
  --ink-faint:#e0b98a; --accent:#f97316; --clue-bg:#f97316;
  --cell-border:#fcd9a8; --box-border:#c2440a; --input-fg:#c2440a;
  --error-bg:#ffe4cc; --highlight:#fff3d6;
  --cell-size:54px; --sidebar-w:200px;
}

/* ── DESKTOP LAYOUT ── */
body{
  background:var(--bg); font-family:'DM Mono',monospace; color:var(--ink);
  display:flex; min-height:100vh;
  transition:background 0.35s, color 0.35s;
}

/* ── SIDEBAR ── */
.sidebar{
  width:var(--sidebar-w); min-height:100vh; flex-shrink:0;
  background:var(--surface); border-right:2px solid var(--box-border);
  display:flex; flex-direction:column;
  overflow-y:auto; transition:background 0.35s, border-color 0.35s;
  box-shadow:2px 0 12px rgba(0,0,0,0.06);
}
.sidebar-logo{ padding:1.4rem 1rem 1rem; border-bottom:1px solid var(--cell-border); text-align:center; }
.sidebar-logo .logo-fruit{ font-size:2rem; display:inline-block; animation:sway 3s ease-in-out infinite; }
.sidebar-logo .logo-text{ font-family:'Fraunces',serif; font-weight:300; font-size:1rem; letter-spacing:-0.01em; line-height:1.2; margin-top:0.3rem; color:var(--ink); }
.sidebar-logo .logo-text em{ font-style:italic; color:var(--accent); }
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.sidebar-section-label{ font-size:0.58rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-faint); padding:0.9rem 1rem 0.4rem; font-weight:600; }
.fruit-item{ display:flex; align-items:center; gap:10px; padding:9px 12px 9px 14px; cursor:pointer; border-left:3px solid transparent; transition:all 0.15s; position:relative; user-select:none; }
.fruit-item:hover{ background:rgba(0,0,0,0.04); }
.fruit-item.active{ border-left-color:var(--accent); background:rgba(0,0,0,0.05); }
.fruit-item .fi-emoji{ font-size:1.3rem; flex-shrink:0; display:inline-block; }
.fruit-item .fi-info{ display:flex; flex-direction:column; gap:1px; min-width:0; }
.fruit-item .fi-name{ font-size:0.72rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fruit-item .fi-diff{ font-size:0.58rem; letter-spacing:0.04em; text-transform:uppercase; opacity:0.7; }
.fruit-item .fi-badge{ margin-left:auto; font-size:0.48rem; font-weight:700; padding:2px 5px; border-radius:6px; white-space:nowrap; flex-shrink:0; }
.fruit-item:not(.rare):not(.epic):not(.legendary) .fi-badge{ display:none; }
.fruit-item.rare .fi-badge{ background:#fbbf24; color:#5a3e00; }
.fruit-item.epic .fi-badge{ background:#a855f7; color:#fff; }
.fruit-item.legendary .fi-badge{ background:linear-gradient(90deg,#f97316,#ec4899); color:#fff; }
.mode-item{ display:flex; align-items:center; gap:10px; padding:8px 12px 8px 14px; cursor:pointer; border-left:3px solid transparent; transition:all 0.15s; user-select:none; }
.mode-item:hover{ background:rgba(0,0,0,0.04); }
.mode-item.active{ border-left-color:var(--accent); background:rgba(0,0,0,0.05); }
.mode-item .mi-icon{ font-size:1rem; flex-shrink:0; width:20px; text-align:center; display:inline-block; }
.mode-item .mi-info{ display:flex; flex-direction:column; gap:1px; }
.mode-item .mi-name{ font-size:0.72rem; font-weight:500; }
.mode-item .mi-desc{ font-size:0.57rem; opacity:0.6; }
.sidebar-divider{ height:1px; background:var(--cell-border); margin:0.5rem 0; }
.view-toggle-btn{ margin:1rem; font-size:0.62rem; letter-spacing:0.04em; text-transform:uppercase; padding:8px; border-radius:6px; cursor:pointer; border:1.5px solid var(--box-border); background:transparent; color:var(--ink-muted); font-family:'DM Mono',monospace; transition:all 0.15s; width:calc(100% - 2rem); }
.view-toggle-btn:hover{ background:var(--ink); color:var(--surface); }
.sidebar-bottom{ margin-top:auto; padding-bottom:0.5rem; }

/* ── MAIN ── */
.main{ flex:1; display:flex; flex-direction:column; align-items:center; padding:2rem 2rem 3rem; overflow-y:auto; }
.game-header{ text-align:center; margin-bottom:1.6rem; }
.game-header h1{ font-family:'Fraunces',serif; font-weight:300; font-size:2.4rem; letter-spacing:-0.02em; line-height:1; }
.game-header h1 em{ font-style:italic; color:var(--accent); }
.game-header .subtitle{ font-size:0.7rem; color:var(--ink-muted); margin-top:0.35rem; letter-spacing:0.07em; text-transform:uppercase; }
.mode-badge{ display:inline-flex; align-items:center; gap:6px; margin-top:0.6rem; padding:4px 14px; border-radius:20px; border:1.5px solid var(--box-border); font-size:0.68rem; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-muted); }
#headerFruit{ font-size:1.6rem; margin-bottom:0.3rem; display:inline-block; animation:sway 3s ease-in-out infinite; }

/* ── GRID ── */
.grid-wrapper{ background:var(--surface); border:2px solid var(--box-border); border-radius:8px; padding:1.5rem; box-shadow:4px 4px 0 var(--box-border); transition:border-color 0.35s, box-shadow 0.35s, background 0.35s; }
.col-labels{ display:grid; grid-template-columns:20px repeat(9,var(--cell-size)); margin-bottom:3px; }
.col-label{ display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--ink-muted); font-weight:500; }
.rows-area{ display:flex; gap:3px; }
.row-labels-col{ display:flex; flex-direction:column; }
.row-label{ height:var(--cell-size); width:20px; display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--ink-muted); font-weight:500; }
.sudoku-grid{ display:grid; grid-template-columns:repeat(9,var(--cell-size)); grid-template-rows:repeat(9,var(--cell-size)); border:2.5px solid var(--box-border); }
.cell{ width:var(--cell-size); height:var(--cell-size); border:0.5px solid var(--cell-border); position:relative; background:var(--surface); transition:background 0.1s; }
.cell:focus-within{ background:var(--highlight); }
.cell.error{ background:var(--error-bg); }
.cell.given{ background:rgba(0,0,0,0.03); }
.cell.selected{ background:var(--highlight) !important; outline:2px solid var(--accent); outline-offset:-2px; }
.cell.thick-right{ border-right:2.5px solid var(--box-border); }
.cell.thick-bottom{ border-bottom:2.5px solid var(--box-border); }
.cell input{ width:100%; height:100%; border:none; background:transparent; text-align:center; font-family:'DM Mono',monospace; font-size:1.2rem; font-weight:500; color:var(--input-fg); cursor:pointer; outline:none; caret-color:var(--accent); padding:0; }
.cell.given input{ color:var(--ink); font-weight:600; pointer-events:none; }
.cell input::-webkit-inner-spin-button,.cell input::-webkit-outer-spin-button{-webkit-appearance:none;}
.border-clue{ position:absolute; font-size:10px; font-weight:500; font-family:'DM Mono',monospace; background:var(--clue-bg); color:#fff; border-radius:10px; padding:2px 5px; z-index:20; pointer-events:none; line-height:1.3; }
.clue-right{ right:-12px; top:50%; transform:translateY(-50%); }
.clue-bottom{ bottom:-12px; left:50%; transform:translateX(-50%); }
.cage-sum{ position:absolute; top:2px; left:3px; font-size:9px; font-weight:600; color:var(--accent); line-height:1; z-index:15; pointer-events:none; }

/* ── CONTROLS ── */
.controls{ margin-top:1.2rem; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
button{ font-family:'DM Mono',monospace; font-size:0.7rem; letter-spacing:0.04em; text-transform:uppercase; padding:7px 15px; border-radius:4px; cursor:pointer; transition:all 0.12s; border:1.5px solid var(--box-border); background:transparent; color:var(--ink); }
button:hover{ background:var(--ink); color:var(--surface); }
button.primary{ background:var(--ink); color:var(--surface); }
button.primary:hover{ background:var(--accent); border-color:var(--accent); }
.note{ margin-top:0.9rem; font-size:0.65rem; color:var(--ink-faint); letter-spacing:0.04em; text-align:center; }

/* ── VFX ── */
#vfx-overlay{ position:fixed; inset:0; z-index:9999; pointer-events:none; overflow:hidden; }
.vfx-particle{ position:absolute; border-radius:50%; pointer-events:none; }
.vfx-ripple{ position:fixed; width:200px; height:200px; border-radius:50%; pointer-events:none; z-index:9998; transform:translate(-50%,-50%) scale(0); }
.vfx-streak{ position:fixed; pointer-events:none; z-index:9997; }
.vfx-emoji{ position:fixed; pointer-events:none; z-index:9999; display:inline-block; }
@keyframes ripple-out{ 0%{transform:translate(-50%,-50%) scale(0);opacity:0.8;} 100%{transform:translate(-50%,-50%) scale(8);opacity:0;} }
@keyframes streak-l{ 0%{transform:translateX(-110%);opacity:0.85;} 45%{transform:translateX(0);opacity:0.6;} 100%{transform:translateX(110%);opacity:0;} }
@keyframes streak-r{ 0%{transform:translateX(110%);opacity:0.85;} 45%{transform:translateX(0);opacity:0.6;} 100%{transform:translateX(-110%);opacity:0;} }
@keyframes streak-d{ 0%{transform:translateY(-110%);opacity:0.85;} 45%{transform:translateY(0);opacity:0.6;} 100%{transform:translateY(110%);opacity:0;} }
@keyframes shatter{ 0%{transform:translate(0,0) rotate(0) scale(1);opacity:1;} 100%{transform:translate(var(--tx),var(--ty)) rotate(var(--tr)) scale(0);opacity:0;} }
@keyframes emoji-fall{ 0%{transform:translateY(-80px) rotate(0);opacity:1;} 100%{transform:translateY(110vh) rotate(var(--rot));opacity:0;} }
@keyframes cell-pop{ 0%{transform:scale(0) rotate(-8deg);opacity:0;} 65%{transform:scale(1.1) rotate(2deg);opacity:1;} 100%{transform:scale(1) rotate(0);opacity:1;} }
@keyframes grid-flash{ 0%{filter:brightness(2) saturate(2);transform:scale(0.98);} 100%{filter:brightness(1) saturate(1);transform:scale(1);} }
@keyframes glow-pulse{ 0%{box-shadow:4px 4px 0 var(--box-border);} 50%{box-shadow:0 0 40px var(--accent),4px 4px 0 var(--box-border);} 100%{box-shadow:4px 4px 0 var(--box-border);} }
.cell.vfx-pop{ animation:cell-pop 0.35s cubic-bezier(0.34,1.56,0.64,1) both; }
.grid-wrapper.vfx-flash{ animation:grid-flash 0.4s ease forwards; }
.grid-wrapper.vfx-glow{ animation:glow-pulse 0.7s ease forwards; }

/* ── FRUIT/MODE EMOJI ANIMS ── */
@keyframes mango-burst{ 0%{transform:scale(1)} 30%{transform:scale(1.4) rotate(-8deg)} 65%{transform:scale(0.9) rotate(4deg)} 100%{transform:scale(1) rotate(0)} }
@keyframes apple-bounce{ 0%{transform:scale(1) translateY(0)} 30%{transform:scale(1.3) translateY(-10px)} 70%{transform:scale(0.95) translateY(2px)} 100%{transform:scale(1) translateY(0)} }
@keyframes banana-wobble{ 0%{transform:rotate(0)} 25%{transform:rotate(-18deg) scale(1.2)} 55%{transform:rotate(14deg) scale(1.1)} 80%{transform:rotate(-5deg)} 100%{transform:rotate(0) scale(1)} }
@keyframes grape-shake{ 0%{transform:translateX(0) scale(1)} 20%{transform:translateX(-8px) scale(1.2)} 45%{transform:translateX(8px) scale(1.15)} 65%{transform:translateX(-4px) scale(1.05)} 85%{transform:translateX(3px)} 100%{transform:translateX(0) scale(1)} }
@keyframes kiwi-spin{ 0%{transform:scale(1) rotate(0)} 50%{transform:scale(1.3) rotate(180deg)} 100%{transform:scale(1) rotate(360deg)} }
@keyframes dragon-flame{ 0%{transform:scale(1)} 15%{transform:scale(1.6) rotate(-6deg)} 40%{transform:scale(0.8) rotate(6deg)} 65%{transform:scale(1.3) rotate(-3deg)} 85%{transform:scale(0.95)} 100%{transform:scale(1) rotate(0)} }
@keyframes mode-classic{ 0%{transform:scale(1)} 50%{transform:scale(1.2) rotate(-3deg)} 100%{transform:scale(1) rotate(0)} }
@keyframes mode-killer{ 0%{transform:scale(1) skewX(0)} 25%{transform:scale(1.3) skewX(-10deg)} 65%{transform:scale(0.9) skewX(5deg)} 100%{transform:scale(1) skewX(0)} }
@keyframes mode-diag{ 0%{transform:rotate(0) scale(1)} 35%{transform:rotate(45deg) scale(1.3)} 70%{transform:rotate(-20deg) scale(1.1)} 100%{transform:rotate(0) scale(1)} }
@keyframes mode-border{ 0%{transform:scale(1) translateX(0)} 20%{transform:scale(1.2) translateX(-5px)} 50%{transform:scale(1.1) translateX(5px)} 75%{transform:scale(1.05) translateX(-2px)} 100%{transform:scale(1) translateX(0)} }

/* ── MOBILE ── */
body.mobile{ flex-direction:column; overflow-y:auto; min-height:100vh; }
body.mobile .sidebar{ display:none !important; }
body.mobile .main{ padding:0.8rem 0.5rem 7rem; width:100%; overflow:visible; }
body.mobile :root,body.mobile{ --cell-size:calc((100vw - 44px) / 9); }
body.mobile .game-header{ margin-bottom:0.8rem; }
body.mobile .game-header h1{ font-size:1.5rem; }
body.mobile .game-header .subtitle{ font-size:0.6rem; }
body.mobile .mode-badge{ font-size:0.6rem; padding:3px 10px; }
body.mobile #headerFruit{ font-size:1.2rem !important; }
body.mobile .grid-wrapper{ padding:0.5rem; }
body.mobile .col-labels{ grid-template-columns:14px repeat(9,var(--cell-size)); }
body.mobile .col-label{ font-size:8px; }
body.mobile .row-label{ width:14px; font-size:8px; }
body.mobile .border-clue{ font-size:8px; padding:1px 3px; border-radius:7px; }
body.mobile .clue-right{ right:-9px; }
body.mobile .clue-bottom{ bottom:-9px; }
body.mobile .cage-sum{ font-size:7px; }
body.mobile .cell input{ font-size:1rem; }
body.mobile .controls{ margin-top:0.7rem; gap:5px; }
body.mobile button{ font-size:0.6rem; padding:6px 9px; }
body.mobile .note{ display:none; }

/* Mobile nav */
.mobile-nav{ display:none; }
body.mobile .mobile-nav{ display:flex; position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:2px solid var(--box-border); z-index:1000; height:56px; box-shadow:0 -2px 12px rgba(0,0,0,0.1); }
.mobile-nav-btn{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer; border:none; background:transparent; color:var(--ink-muted); font-family:'DM Mono',monospace; font-size:0.52rem; letter-spacing:0.04em; text-transform:uppercase; padding:0; transition:color 0.15s; border-right:1px solid var(--cell-border); -webkit-tap-highlight-color:transparent; }
.mobile-nav-btn:last-child{ border-right:none; }
.mobile-nav-btn .nav-icon{ font-size:1.3rem; line-height:1; display:inline-block; }
.mobile-nav-btn.active{ color:var(--accent); }

/* Mobile sheets */
.mobile-sheet{ display:none; }
body.mobile .mobile-sheet{ display:none; position:fixed; bottom:56px; left:0; right:0; background:var(--surface); border-top:2px solid var(--box-border); z-index:999; padding:0.8rem; max-height:55vh; overflow-y:auto; border-radius:16px 16px 0 0; box-shadow:0 -4px 20px rgba(0,0,0,0.12); }
body.mobile .mobile-sheet.open{ display:block; }
.sheet-title{ font-size:0.62rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:0.7rem; text-align:center; }
.sheet-fruits{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.sheet-fruit-btn{ display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 4px; border-radius:10px; border:2px solid transparent; cursor:pointer; background:rgba(0,0,0,0.03); transition:all 0.15s; font-family:'DM Mono',monospace; -webkit-tap-highlight-color:transparent; }
.sheet-fruit-btn.active{ border-color:var(--accent); background:rgba(0,0,0,0.06); }
.sheet-fruit-btn .sf-emoji{ font-size:1.6rem; display:inline-block; }
.sheet-fruit-btn .sf-name{ font-size:0.58rem; font-weight:500; color:var(--ink); }
.sheet-fruit-btn .sf-badge{ font-size:0.48rem; font-weight:700; padding:1px 5px; border-radius:6px; }
.sheet-modes{ display:flex; flex-direction:column; gap:6px; }
.sheet-mode-btn{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; border:2px solid transparent; cursor:pointer; background:rgba(0,0,0,0.03); transition:all 0.15s; font-family:'DM Mono',monospace; -webkit-tap-highlight-color:transparent; }
.sheet-mode-btn.active{ border-color:var(--accent); background:rgba(0,0,0,0.06); }
.sheet-mode-btn .sm-icon{ font-size:1.2rem; display:inline-block; }
.sheet-mode-btn .sm-name{ font-size:0.72rem; font-weight:500; color:var(--ink); }
.sheet-mode-btn .sm-desc{ font-size:0.57rem; color:var(--ink-muted); }

/* Numpad */
.numpad-sheet{ display:none; }
body.mobile .numpad-sheet{ display:none; position:fixed; bottom:56px; left:0; right:0; background:var(--surface); border-top:2px solid var(--box-border); z-index:999; padding:0.6rem; border-radius:16px 16px 0 0; box-shadow:0 -4px 20px rgba(0,0,0,0.12); }
body.mobile .numpad-sheet.open{ display:block; }
.numpad-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:0.6rem; padding-bottom:0.5rem; border-bottom:1px solid var(--cell-border); }
.numpad-meta{ font-size:0.7rem; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:var(--accent); }
.numpad-close{ width:30px; height:30px; border-radius:50%; border:1.5px solid var(--cell-border); background:transparent; color:var(--ink-muted); font-size:0.9rem; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:'DM Mono',monospace; -webkit-tap-highlight-color:transparent; }
.numpad-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
.numpad-btn{ height:52px; border:1.5px solid var(--cell-border); border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:opacity 0.1s; -webkit-tap-highlight-color:transparent; }
.numpad-btn:active{ opacity:0.7; transform:scale(0.94); }

/* Toast */
#toast{ position:fixed; bottom:1.8rem; left:50%; transform:translateX(-50%); background:var(--clue-bg); color:#fff; font-family:'DM Mono',monospace; font-size:0.76rem; padding:9px 20px; border-radius:20px; box-shadow:0 4px 14px rgba(0,0,0,0.15); opacity:0; transition:opacity 0.3s; pointer-events:none; z-index:9999; letter-spacing:0.04em; white-space:nowrap; }
</style>
</head>
<body>

<div id="vfx-overlay"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <span class="logo-fruit" id="sidebarFruit">🥭</span>
    <div class="logo-text">Fruit<em>line</em><br>Sudoku</div>
  </div>
  <div class="sidebar-section-label">🍑 Fruit Theme</div>
  <div id="fruitList"></div>
  <div class="sidebar-divider"></div>
  <div class="sidebar-section-label">🎮 Game Mode</div>
  <div id="modeList"></div>
  <div class="sidebar-bottom">
    <button class="view-toggle-btn" id="viewToggleBtn" onclick="toggleViewMode()">📱 Mobile View</button>
  </div>
</aside>

<!-- MAIN -->
<main class="main">
  <div class="game-header">
    <div id="headerFruit">🥭</div>
    <h1 id="mainTitle">Juicy<em>line</em> Sudoku</h1>
    <div class="subtitle" id="mainSubtitle">Sweet clues, sweeter solutions.</div>
    <div class="mode-badge" id="modeBadge"><span>🔢</span> Borderline Mode</div>
  </div>
  <div class="grid-wrapper" id="gridWrapper">
    <div class="col-labels">
      <div></div>
      <div class="col-label">A</div><div class="col-label">B</div><div class="col-label">C</div>
      <div class="col-label">D</div><div class="col-label">E</div><div class="col-label">F</div>
      <div class="col-label">G</div><div class="col-label">H</div><div class="col-label">I</div>
    </div>
    <div class="rows-area">
      <div class="row-labels-col">
        <div class="row-label">1</div><div class="row-label">2</div><div class="row-label">3</div>
        <div class="row-label">4</div><div class="row-label">5</div><div class="row-label">6</div>
        <div class="row-label">7</div><div class="row-label">8</div><div class="row-label">9</div>
      </div>
      <div class="sudoku-grid" id="grid"></div>
    </div>
    <div class="controls">
      <button onclick="refreshBoard()">⟳ Refresh</button>
      <button onclick="clearAll()">Clear</button>
      <button onclick="checkErrors()">Check</button>
      <button class="primary" onclick="clearErrors()">✓ Clear Errors</button>
    </div>
  </div>
  <p class="note">Type 1–9 · Arrow keys to navigate · Delete to erase</p>
</main>

<!-- MOBILE NAV -->
<nav class="mobile-nav">
  <button class="mobile-nav-btn" onclick="toggleSheet('fruitSheet')">
    <span class="nav-icon" id="navFruitIcon">🥭</span><span>Fruit</span>
  </button>
  <button class="mobile-nav-btn" onclick="toggleSheet('modeSheet')">
    <span class="nav-icon">🎮</span><span>Mode</span>
  </button>
  <button class="mobile-nav-btn" onclick="refreshBoard()">
    <span class="nav-icon">⟳</span><span>Sync</span>
  </button>
  <button class="mobile-nav-btn" onclick="clearAll()">
    <span class="nav-icon">🗑️</span><span>Clear</span>
  </button>
  <button class="mobile-nav-btn" onclick="toggleViewMode()">
    <span class="nav-icon">🖥️</span><span>Desktop</span>
  </button>
</nav>

<!-- FRUIT SHEET -->
<div class="mobile-sheet" id="fruitSheet">
  <div class="sheet-title">🍑 Choose your fruit</div>
  <div class="sheet-fruits" id="sheetFruits"></div>
</div>

// ══ VFX ══
const VFX = {
  ripple(color){
    const el=document.createElement('div'); el.className='vfx-ripple';
    el.style.cssText=`left:50%;top:40%;background:${color};`;
    document.body.appendChild(el); void el.offsetWidth;
    el.style.animation='ripple-out 0.7s ease-out forwards';
    setTimeout(()=>el.remove(),800);
  },
  streaks(colors,dir){
    colors.forEach((c,i)=>{
      const el=document.createElement('div'); el.className='vfx-streak';
      const anim=dir==='r'?'streak-r':dir==='d'?'streak-d':'streak-l';
      if(dir==='d') el.style.cssText=`top:0;left:${i*34}%;width:34%;height:120px;background:${c};border-radius:0 0 50% 50%;animation:${anim} ${0.45+i*0.06}s ${i*0.07}s ease forwards;`;
      else el.style.cssText=`top:${8+i*14}%;left:0;width:100%;height:${60/(i+1.5)}px;background:${c};border-radius:60px;animation:${anim} ${0.45+i*0.06}s ${i*0.06}s ease forwards;`;
      document.body.appendChild(el); setTimeout(()=>el.remove(),900);
    });
  },
  particles(c1,c2,n){
    const ov=document.getElementById('vfx-overlay');
    for(let i=0;i<n;i++){
      const p=document.createElement('div'); p.className='vfx-particle';
      const sz=6+Math.random()*16, x=Math.random()*100, y=Math.random()*100;
      const tx=(Math.random()-.5)*300, ty=(Math.random()-.5)*300, tr=(Math.random()-.5)*720;
      const dur=0.4+Math.random()*0.5;
      p.style.cssText=`width:${sz}px;height:${sz}px;left:${x}%;top:${y}%;background:${Math.random()>.5?c1:c2};--tx:${tx}px;--ty:${ty}px;--tr:${tr}deg;animation:shatter ${dur}s ${Math.random()*0.2}s ease-out forwards;`;
      ov.appendChild(p); setTimeout(()=>p.remove(),900);
    }
  },
  shower(emoji,n){
    for(let i=0;i<n;i++){
      const el=document.createElement('div'); el.className='vfx-emoji';
      el.textContent=emoji;
      const x=5+Math.random()*90, rot=(Math.random()-.5)*720;
      const dur=0.8+Math.random()*0.7, delay=Math.random()*0.4;
      el.style.cssText=`left:${x}%;top:-70px;--rot:${rot}deg;animation:emoji-fall ${dur}s ${delay}s ease-in forwards;font-size:${1.2+Math.random()*1.4}rem;`;
      document.body.appendChild(el); setTimeout(()=>el.remove(),(dur+delay)*1000+100);
    }
  },
  cascade(order){
    if(!cells.length) return;
    order.forEach(([r,c],i)=>{
      setTimeout(()=>{
        if(!cells[r]||!cells[r][c]) return;
        const cell=cells[r][c];
        cell.classList.remove('vfx-pop'); void cell.offsetWidth;
        cell.classList.add('vfx-pop');
        setTimeout(()=>cell.classList.remove('vfx-pop'),400);
      },i*11);
    });
  },
  flash(){
    const gw=document.getElementById('gridWrapper');
    gw.classList.remove('vfx-flash','vfx-glow'); void gw.offsetWidth;
    gw.classList.add('vfx-flash','vfx-glow');
    setTimeout(()=>gw.classList.remove('vfx-flash','vfx-glow'),800);
  },
  rowOrder(){const o=[];for(let r=0;r<9;r++)for(let c=0;c<9;c++)o.push([r,c]);return o;},
  colOrder(){const o=[];for(let c=0;c<9;c++)for(let r=0;r<9;r++)o.push([r,c]);return o;},
  spiralOrder(){
    const o=[],v=Array.from({length:9},()=>Array(9).fill(false));
    let t=0,b=8,l=0,r=8;
    while(t<=b&&l<=r){
      for(let c=l;c<=r;c++)o.push([t,c]);t++;
      for(let rr=t;rr<=b;rr++)o.push([rr,r]);r--;
      if(t<=b){for(let c=r;c>=l;c--)o.push([b,c]);b--;}
      if(l<=r){for(let rr=b;rr>=t;rr--)o.push([rr,l]);l++;}
    }
    return o;
  },
  diagOrder(){const o=[];for(let d=0;d<17;d++)for(let r=0;r<9;r++){const c=d-r;if(c>=0&&c<9)o.push([r,c]);}return o;},
  spinOrder(){
    const all=[];for(let r=0;r<9;r++)for(let c=0;c<9;c++)all.push([r,c]);
    return all.sort((a,b)=>Math.atan2(a[0]-4,a[1]-4)-Math.atan2(b[0]-4,b[1]-4));
  },

  playFruit(id){
    const f=curFruit;
    if(id==='mango'){  this.ripple('#f97316');this.shower('🥭',12);this.streaks(['#fff7ed','#fbbf24','#f97316'],'l');this.cascade(this.rowOrder()); }
    if(id==='apple'){  this.ripple('#e53e3e');this.shower('🍎',10);this.streaks(['#fff5f5','#fca5a5','#e53e3e'],'r');this.cascade(this.colOrder()); }
    if(id==='banana'){ this.ripple('#d97706');this.shower('🍌',14);this.streaks(['#fffde7','#fde68a','#d97706'],'d');this.cascade(this.colOrder()); }
    if(id==='grape'){  this.ripple('#7c3aed');this.shower('🍇',15);this.particles('#7c3aed','#ddd6fe',22);this.cascade(this.spiralOrder()); }
    if(id==='kiwi'){   this.ripple('#16a34a');this.shower('🥝',12);this.streaks(['#f0fdf4','#86efac','#16a34a'],'l');this.cascade(this.spinOrder()); }
    if(id==='dragon'){ this.ripple('#ec4899');this.shower('🐉',8);this.shower('✨',10);this.particles('#ec4899','#f97316',28);this.streaks(['#fff0f9','#ec4899','#f97316'],'l'); this.cascade(this.spiralOrder()); }
    this.flash();
  },
  playMode(id){
    if(id==='classic'){    this.ripple(curFruit.accent);this.cascade(this.colOrder()); }
    if(id==='borderline'){ this.ripple(curFruit.accent);this.cascade(this.rowOrder()); }
    if(id==='killer'){     this.ripple('#6366f1');this.particles('#6366f1','#f43f5e',18);this.cascade(this.spiralOrder()); }
    if(id==='diagonal'){   this.ripple(curFruit.accent);this.cascade(this.diagOrder()); }
    this.flash();
  },

  animEmoji(el,name,dur){ if(!el)return; el.style.animation='none'; void el.offsetWidth; el.style.animation=`${name} ${dur}s ease forwards`; },
  fruitEmoji(id){
    const anims={mango:'mango-burst 0.5s',apple:'apple-bounce 0.5s',banana:'banana-wobble 0.55s',grape:'grape-shake 0.55s',kiwi:'kiwi-spin 0.5s',dragon:'dragon-flame 0.6s'};
    const a=anims[id]||anims.mango;
    [document.getElementById('sidebarFruit'),document.getElementById('headerFruit'),document.getElementById('navFruitIcon'),document.querySelector(`.fruit-item[data-id="${id}"] .fi-emoji`),document.querySelector(`.sheet-fruit-btn[data-id="${id}"] .sf-emoji`)].forEach(el=>{ if(!el)return; el.style.animation='none'; void el.offsetWidth; el.style.animation=a; });
  },
  modeEmoji(id){
    const anims={classic:'mode-classic 0.4s',killer:'mode-killer 0.45s',diagonal:'mode-diag 0.5s',borderline:'mode-border 0.45s'};
    const a=anims[id]||anims.classic;
    [document.querySelector(`.mode-item[data-id="${id}"] .mi-icon`),document.querySelector(`.sheet-mode-btn[data-id="${id}"] .sm-icon`)].forEach(el=>{ if(!el)return; el.style.animation='none'; void el.offsetWidth; el.style.animation=a; });
  },
};

  diagonal:  (n,f)=>{ const g=['linear-gradient(135deg,#fef9c3,#fde68a)','linear-gradient(135deg,#e0f2fe,#bae6fd)','linear-gradient(135deg,#dcfce7,#bbf7d0)','linear-gradient(135deg,#fee2e2,#fecaca)','linear-gradient(135deg,#f3e8ff,#e9d5ff)','linear-gradient(135deg,#ffedd5,#fed7aa)','linear-gradient(135deg,#dbeafe,#bfdbfe)','linear-gradient(135deg,#fce7f3,#fbcfe8)','linear-gradient(135deg,#ecfccb,#d9f99d)']; const col=['#a16207','#0369a1','#15803d','#b91c1c','#7e22ce','#c2440a','#1d4ed8','#be185d','#4d7c0f']; return {background:g[n-1],border:'none',color:col[n-1],fontFamily:"'Righteous',sans-serif",fontWeight:'800',fontSize:'1.3rem',borderRadius:'10px',boxShadow:'0 2px 6px rgba(0,0,0,0.1)'}; },

// ══ BUILD GRID ══
function buildGrid(){
  const grid=document.getElementById('grid');
  grid.innerHTML=''; cells=[];
  for(let r=0;r<9;r++){
    cells[r]=[];
    for(let c=0;c<9;c++){
      const cell=document.createElement('div');
      cell.className='cell';
      if([2,5].includes(c)) cell.classList.add('thick-right');
      if([2,5].includes(r)) cell.classList.add('thick-bottom');
      const inp=document.createElement('input');
      inp.type='text'; inp.maxLength=1; inp.inputMode='numeric';
      inp.dataset.row=r; inp.dataset.col=c;
      inp.addEventListener('keydown',handleKey);
      inp.addEventListener('input',handleInput);
      cell.appendChild(inp);
      cell.addEventListener('click',()=>{ if(!isMobile())return; if(inp.readOnly)return; closeAllSheets(); if(selectedCell)selectedCell.classList.remove('selected'); selectedCell=cell; cell.classList.add('selected'); document.getElementById('numpadSheet').classList.add('open'); });
      cells[r][c]=cell;
      grid.appendChild(cell);
    }
  }
}

function setupMode(){
  for(let r=0;r<9;r++) for(let c=0;c<9;c++){
    const cell=cells[r][c];
    cell.querySelectorAll('.border-clue,.cage-sum').forEach(e=>e.remove());
    cell.classList.remove('given');
    const inp=cell.querySelector('input');
    inp.value=''; inp.readOnly=false;
  }
  if(curMode.id==='borderline'){
    const clues=BORDERLINE[curFruit.id]||BORDERLINE.mango;
    clues.forEach(({col,row,dir,val})=>{
      const d=document.createElement('div');
      d.className='border-clue '+(dir==='r'?'clue-right':'clue-bottom');
      d.textContent=val; cells[row][col].appendChild(d);
    });
  }
  if(curMode.id==='classic'||curMode.id==='diagonal'){
    const src=curMode.id==='diagonal'?DIAGONAL:CLASSIC;
    const givens=src[curFruit.id]||src.mango;
    givens.forEach(([r,c,v])=>{ cells[r][c].classList.add('given'); cells[r][c].querySelector('input').value=v; cells[r][c].querySelector('input').readOnly=true; });
  }
  if(curMode.id==='killer'){
    const cages=KILLER_CAGES[curFruit.id]||KILLER_CAGES.mango;
    cages.forEach(cage=>{
      const [tr,tc]=[...cage.cells].sort((a,b)=>a[0]-b[0]||a[1]-b[1])[0];
      const lbl=document.createElement('div'); lbl.className='cage-sum'; lbl.textContent=cage.sum;
      cells[tr][tc].appendChild(lbl);
    });
  }
}

// ══ THEME ══
function applyTheme(f){
  const s=document.documentElement.style;
  ['bg','surface','ink','inkMuted','accent','clueBg','boxBorder','inputFg','cellBorder','errorBg','highlight'].forEach(k=>{
    s.setProperty('--'+k.replace(/([A-Z])/g,'-$1').toLowerCase(), f[k]);
  });
  document.getElementById('sidebarFruit').textContent=f.emoji;
  document.getElementById('headerFruit').textContent=f.emoji;
  document.getElementById('navFruitIcon').textContent=f.emoji;
  document.getElementById('mainTitle').innerHTML=`${f.phrase}<em>line</em> Sudoku`;
  document.getElementById('mainSubtitle').textContent=f.tagline;
  document.querySelectorAll('.fruit-item').forEach(el=>el.classList.toggle('active',el.dataset.id===f.id));
  updateModeUI();
  updateMobileSheets();
}

function updateModeUI(){
  const m=curMode;
  document.getElementById('modeBadge').innerHTML=`<span>${m.icon}</span> ${m.name} Mode`;
  document.querySelectorAll('.mode-item').forEach(el=>el.classList.toggle('active',el.dataset.id===m.id));
  document.querySelectorAll('.sheet-mode-btn').forEach(el=>el.classList.toggle('active',el.dataset.id===m.id));
}

// ══ SWITCH ══
function switchFruit(id){
  saveProgress();
  curFruit=FRUITS.find(f=>f.id===id);
  VFX.fruitEmoji(id);
  VFX.playFruit(id);
  applyTheme(curFruit);
  buildGrid(); setupMode(); loadProgress(false);
}

function switchMode(id){
  saveProgress();
  curMode=MODES.find(m=>m.id===id);
  VFX.modeEmoji(id);
  VFX.playMode(id);
  updateModeUI();
  buildGrid(); setupMode(); loadProgress(false);
  buildNumpad();
}

// ══ INPUT ══
function handleInput(e){
  const v=e.target.value.replace(/[^1-9]/g,'');
  e.target.value=v?v[v.length-1]:'';
  checkErrors(); saveProgress();
}
function handleKey(e){
  const r=+e.target.dataset.row,c=+e.target.dataset.col;
  const m={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]};
  if(m[e.key]){e.preventDefault();const[dr,dc]=m[e.key];const nr=r+dr,nc=c+dc;if(nr>=0&&nr<9&&nc>=0&&nc<9)cells[nr][nc].querySelector('input').focus();}
  if(e.key==='Backspace'||e.key==='Delete'){if(!e.target.readOnly){e.target.value='';checkErrors();saveProgress();}}
}

// ══ VALIDATION ══
function checkErrors(){
  clearErrors();
  const get=(r,c)=>cells[r][c].querySelector('input').value;
  for(let r=0;r<9;r++){const s={};for(let c=0;c<9;c++){const v=get(r,c);if(!v)continue;if(s[v]!==undefined){cells[r][c].classList.add('error');cells[r][s[v]].classList.add('error');}else s[v]=c;}}
  for(let c=0;c<9;c++){const s={};for(let r=0;r<9;r++){const v=get(r,c);if(!v)continue;if(s[v]!==undefined){cells[r][c].classList.add('error');cells[s[v]][c].classList.add('error');}else s[v]=r;}}
  for(let br=0;br<3;br++)for(let bc=0;bc<3;bc++){const s={};for(let dr=0;dr<3;dr++)for(let dc=0;dc<3;dc++){const r=br*3+dr,c=bc*3+dc,v=get(r,c);if(!v)continue;const k=r+','+c;if(s[v]){cells[r][c].classList.add('error');const[pr,pc]=s[v].split(',');cells[pr][pc].classList.add('error');}else s[v]=k;}}
  if(curMode.id==='borderline'){
    const clues=BORDERLINE[curFruit.id]||BORDERLINE.mango;
    clues.forEach(cl=>{
      let r2=cl.row,c2=cl.col;
      if(cl.dir==='r')c2++;else r2++;
      if(r2>8||c2>8)return;
      const a=get(cl.row,cl.col),b=get(r2,c2);
      if(a&&b&&Math.abs(parseInt(a)-parseInt(b))!==cl.val){cells[cl.row][cl.col].classList.add('error');cells[r2][c2].classList.add('error');}
    });
  }
  if(curMode.id==='diagonal'){
    {const s={};for(let i=0;i<9;i++){const v=get(i,i);if(!v)continue;if(s[v]!==undefined){cells[i][i].classList.add('error');cells[s[v]][s[v]].classList.add('error');}else s[v]=i;}}
    {const s={};for(let i=0;i<9;i++){const v=get(i,8-i);if(!v)continue;if(s[v]!==undefined){cells[i][8-i].classList.add('error');cells[s[v]][8-s[v]].classList.add('error');}else s[v]=i;}}
  }
  if(curMode.id==='killer'){
    const cages=KILLER_CAGES[curFruit.id]||KILLER_CAGES.mango;
    cages.forEach(cage=>{
      const seen={};
      cage.cells.forEach(([r,c])=>{const v=get(r,c);if(!v)return;if(seen[v]){cells[r][c].classList.add('error');const[pr,pc]=seen[v];cells[pr][pc].classList.add('error');}else seen[v]=[r,c];});
      const vals=cage.cells.map(([r,c])=>get(r,c)).filter(Boolean);
      if(vals.length===cage.cells.length&&vals.reduce((a,b)=>a+parseInt(b),0)!==cage.sum) cage.cells.forEach(([r,c])=>cells[r][c].classList.add('error'));
    });
  }
}
function clearErrors(){for(let r=0;r<9;r++)for(let c=0;c<9;c++)cells[r][c].classList.remove('error');}

// ══ SAVE / LOAD ══
function saveKey(){return 'fs_'+curFruit.id+'_'+curMode.id;}
function saveProgress(){
  const d=[];
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){const inp=cells[r][c].querySelector('input');d.push(inp.readOnly?'':inp.value||'');}
  localStorage.setItem(saveKey(),JSON.stringify(d));
}
function loadProgress(silent){
  const saved=localStorage.getItem(saveKey());
  if(!saved)return;
  const d=JSON.parse(saved);let filled=0;
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){const inp=cells[r][c].querySelector('input');if(inp.readOnly)continue;const v=d[r*9+c]||'';inp.value=v;if(v)filled++;}
  checkErrors();
  if(!silent&&filled>0)showToast('Progress restored '+curFruit.emoji);
}
function clearAll(){
  if(!confirm('Clear progress for '+curFruit.name+' '+curMode.name+'? '+curFruit.emoji))return;
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){const inp=cells[r][c].querySelector('input');if(!inp.readOnly){inp.value='';cells[r][c].classList.remove('error');}}
  localStorage.removeItem(saveKey());
  showToast('Cleared '+curFruit.emoji);
}
function refreshBoard(){loadProgress(true);showToast('Refreshed '+curFruit.emoji);}

// ══ TOAST ══
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.opacity='0',2200);
}

// ══ MOBILE ══
function isMobile(){return document.body.classList.contains('mobile');}

function buildMobileSheets(){
  const sf=document.getElementById('sheetFruits');
  sf.innerHTML='';
  FRUITS.forEach(f=>{
    const btn=document.createElement('div');
    btn.className='sheet-fruit-btn'+(f.rarity?' '+f.rarity:'');
    btn.dataset.id=f.id;
    const bc={rare:'background:#fbbf24;color:#5a3e00',epic:'background:#a855f7;color:#fff',legendary:'background:linear-gradient(90deg,#f97316,#ec4899);color:#fff'};
    btn.innerHTML=`<div class="sf-emoji">${f.emoji}</div><div class="sf-name">${f.name}</div><div class="sf-badge" style="${bc[f.rarity]||'display:none'}">${f.rarityLabel||''}</div>`;
    btn.addEventListener('click',()=>{switchFruit(f.id);closeAllSheets();});
    sf.appendChild(btn);
  });
  const sm=document.getElementById('sheetModes');
  sm.innerHTML='';
  MODES.forEach(m=>{
    const btn=document.createElement('div');
    btn.className='sheet-mode-btn';
    btn.dataset.id=m.id;
    btn.innerHTML=`<div class="sm-icon">${m.icon}</div><div><div class="sm-name">${m.name}</div><div class="sm-desc">${m.desc}</div></div>`;
    btn.addEventListener('click',()=>{switchMode(m.id);closeAllSheets();});
    sm.appendChild(btn);
  });
  updateMobileSheets();
}

function updateMobileSheets(){
  document.querySelectorAll('.sheet-fruit-btn').forEach(b=>b.classList.toggle('active',b.dataset.id===curFruit.id));
  document.querySelectorAll('.sheet-mode-btn').forEach(b=>b.classList.toggle('active',b.dataset.id===curMode.id));
}

function buildNumpad(){
  const grid=document.getElementById('numpadGrid');
  grid.innerHTML='';
  const getStyle=NUMPAD_MODE_STYLE[curMode.id]||NUMPAD_MODE_STYLE.classic;
  [1,2,3,4,5,6,7,8,9].forEach(n=>{
    const btn=document.createElement('button');
    btn.className='numpad-btn';
    btn.textContent=n;
    const s=getStyle(n,curFruit);
    btn.style.cssText=Object.entries(s).map(([k,v])=>k.replace(/([A-Z])/g,'-$1').toLowerCase()+':'+v).join(';');
    btn.addEventListener('click',()=>numpadPress(String(n)));
    grid.appendChild(btn);
  });
  const del=document.createElement('button');
  del.className='numpad-btn';
  del.textContent='⌫';
  del.style.cssText=`background:#f8f8f8;border:1.5px solid #ddd;color:#888;font-size:1.2rem;border-radius:10px;`;
  del.addEventListener('click',()=>numpadPress('del'));
  grid.appendChild(del);
  const meta=document.getElementById('numpadMeta');
  if(meta) meta.textContent=curFruit.emoji+' '+curFruit.name+' · '+curMode.icon+' '+curMode.name;
}

function numpadPress(val){
  if(!selectedCell)return;
  const inp=selectedCell.querySelector('input');
  if(inp.readOnly)return;
  inp.value=val==='del'?'':val;
  inp.dispatchEvent(new Event('input',{bubbles:true}));
}
function closeNumpad(){
  document.getElementById('numpadSheet').classList.remove('open');
  if(selectedCell){selectedCell.classList.remove('selected');selectedCell=null;}
}
function toggleSheet(id){
  const s=document.getElementById(id);
  const open=s.classList.contains('open');
  closeAllSheets();
  if(!open)s.classList.add('open');
}
function closeAllSheets(){
  document.querySelectorAll('.mobile-sheet,.numpad-sheet').forEach(s=>s.classList.remove('open'));
}

document.addEventListener('click',e=>{
  if(!isMobile())return;
  if(!e.target.closest('.mobile-sheet,.numpad-sheet,.mobile-nav-btn,.cell,.numpad-close'))
    closeAllSheets();
});

// ══ VIEW TOGGLE ══
function toggleViewMode(){
  const mob=isMobile();
  document.body.classList.toggle('mobile',!mob);
  localStorage.setItem('fruitsudoku_viewmode',mob?'desktop':'mobile');
  showToast(mob?'Desktop view 🖥️':'Mobile view 📱');
  if(!mob) setTimeout(()=>{buildMobileSheets();buildNumpad();},50);
  const btn=document.getElementById('viewToggleBtn');
  if(btn) btn.textContent=mob?'📱 Mobile View':'🖥️ Desktop View';
}

window.addEventListener('storage',e=>{
